<!doctype html>
<html lang="en" class="theme-midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Emmanuele S. Alcañices - BS Information Technology student specializing in Web and Mobile Application Development." />

    <!-- SettingsContext keeps this in sync with the active theme, so the
         address bar on mobile always matches the page. -->
    <meta name="theme-color" content="#05070f" />

    <!-- Open Graph tags, so a shared link looks right in chat apps -->
    <meta property="og:title" content="Emmanuele S. Alcañices | IT Portfolio" />
    <meta property="og:description" content="BS Information Technology student building web apps, Android apps, database systems, and a 3D Unity capstone." />
    <meta property="og:type" content="website" />

    <title>Emmanuele S. Alcañices | IT Portfolio</title>

    <style>
      /* A tiny inline style block, so the page background is already the
         right colour before the CSS file finishes downloading. Without
         this you get a white flash on a dark theme. */
      html.theme-midnight { background: #05070f; }
      html.theme-daylight { background: #f4f7fd; }
      html.theme-neon     { background: #0a0413; }
      html.theme-solar    { background: #fdf6ec; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
